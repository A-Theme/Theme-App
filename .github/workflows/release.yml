# Build the desktop app and publish a release, on tag.
#
# Packaging happens here rather than on whoever's laptop tagged it, so the
# artifacts attached to a release are always built from exactly the commit the
# tag points at, with a known toolchain. Push a v* tag and the release appears.
#
#   npm version minor -m "..."      # bumps package.json and tags
#   git push && git push --tags
#
# The Windows build is produced on Windows so the executable can carry its icon
# and version metadata - @electron/packager needs wine to do that from Linux,
# and a build that silently drops the icon is worse than one that takes an
# extra runner.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 2.1.0)'
        required: true

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            name: win32-x64
          - os: ubuntu-latest
            platform: linux
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          # 22+, not 20: @electron/asar refuses to run on anything older, and
          # the verify step below uses it. electron-packager's own deps warn
          # EBADENGINE on 20 too.
          node-version: '22'

      - name: Install
        run: npm ci || npm install

      - name: Package
        shell: bash
        run: |
          npx electron-packager . \
            --platform=${{ matrix.platform }} --arch=x64 \
            --out=dist --overwrite \
            --ignore='^[\\/]dist([\\/]|$)' \
            --ignore='^[\\/]tests([\\/]|$)' \
            --ignore='^[\\/]\.github([\\/]|$)' \
            --ignore='^[\\/]\.gitignore$' \
            --ignore='^[\\/]discord-embed\.json$' \
            --ignore='^[\\/]node_modules([\\/]|$)'

      # The launcher and both editors must actually be in the bundle. A packager
      # ignore rule that is slightly too greedy produces an app that starts and
      # then cannot find its own pages, which is not obvious from a build log.
      - name: Verify the bundle
        shell: bash
        run: |
          set -e
          APP=$(find dist -name app.asar | head -1)
          [ -n "$APP" ] || { echo "no app.asar produced"; exit 1; }
          # The Windows runner leaves a CR on each line AND asar lists paths
          # with backslashes there, so normalise both before matching. Either
          # one alone makes every grep -x miss.
          LIST=$(npx asar list "$APP" | tr -d '\r' | tr '\\' '/')
          echo "$LIST"
          for f in /index.html /romm-theme-editor.html /tinfoil-theme-editor.html /main.js; do
            echo "$LIST" | grep -qx "$f" || { echo "MISSING from bundle: $f"; exit 1; }
          done
          # And nothing that has no business shipping. The ignore patterns used
          # forward slashes only, so Windows quietly bundled node_modules and
          # the test suite until the listing above made it visible.
          for f in /node_modules /tests /.github; do
            echo "$LIST" | grep -qx "$f" && { echo "SHOULD NOT BE BUNDLED: $f"; exit 1; }
          done
          echo "bundle is clean: launcher, both editors, no stowaways"

      - name: Zip
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          DIR=$(find dist -maxdepth 1 -mindepth 1 -type d | head -1)
          OUT="AramakiThemeEditor-${VERSION}-${{ matrix.name }}.zip"
          cd "$DIR" && 7z a -tzip "../../$OUT" . >/dev/null || (cd "$DIR" && zip -qr "../../$OUT" .)
          cd "$GITHUB_WORKSPACE" && ls -la *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: '*.zip'

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts

      # Release notes come from CHANGELOG.md rather than being written into the
      # tag or the web UI, so they are reviewable in a pull request like
      # anything else and cannot be lost by the tag push failing.
      - name: Extract the notes for this version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          awk -v v="## $VERSION" '
            $0 == v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "No CHANGELOG.md section for $VERSION - add one before releasing." >&2
            exit 1
          fi
          cat NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          # On a manual run the tag does not exist yet; the action creates it
          # against the commit this workflow ran on. That is deliberate: pushing
          # a tag is not always possible from every environment, and a release
          # that cannot be cut without shell access is a release nobody cuts.
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          body_path: NOTES.md
          # Appends the commit list under the written notes rather than
          # replacing them.
          generate_release_notes: true
          files: artifacts/*.zip
